name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kist
          POSTGRES_PASSWORD: kist
          POSTGRES_DB: kist_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kist -d kist_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KIST_TEST_DATABASE_URL: postgresql+psycopg://kist:kist@localhost:5432/kist_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-dev ffmpeg libmagic1
      - run: pip install -e ".[dev]"
      - run: ruff check kist tests migrations
      - run: pytest -q

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
