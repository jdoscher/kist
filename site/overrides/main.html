{% extends "base.html" %}
{# Link previews use the social card (docs/brand/build_social.py). #}
{% block extrahead %}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% if page and page.title and not page.is_homepage %}{{ page.title }} · {% endif %}{{ config.site_name }}">
  <meta property="og:description" content="{{ config.site_description }}">
  <meta property="og:image" content="{{ config.site_url }}brand/social-preview.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#131312">
{% endblock %}
