services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kist
      POSTGRES_PASSWORD: ${KIST_DB_PASSWORD:-kist}
      POSTGRES_DB: kist
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kist -d kist"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    command: ["api"]
    environment:
      KIST_TOKEN: ${KIST_TOKEN:?set KIST_TOKEN in .env}
      KIST_DATABASE_URL: postgresql+psycopg://kist:${KIST_DB_PASSWORD:-kist}@db:5432/kist
      KIST_USER_AGENT: ${KIST_USER_AGENT:-}
    ports:
      - "${KIST_PORT:-8080}:8000"
    volumes:
      - ${KIST_LIBRARY:-./library}:/library
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build: .
    command: ["worker"]
    environment:
      KIST_TOKEN: ${KIST_TOKEN:?set KIST_TOKEN in .env}
      KIST_DATABASE_URL: postgresql+psycopg://kist:${KIST_DB_PASSWORD:-kist}@db:5432/kist
      KIST_USER_AGENT: ${KIST_USER_AGENT:-}
    volumes:
      - ${KIST_LIBRARY:-./library}:/library
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "kist.worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
