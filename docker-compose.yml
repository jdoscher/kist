services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kist
      POSTGRES_PASSWORD: ${KIST_DB_PASSWORD:-kist}
      POSTGRES_DB: kist
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kist -d kist"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    command: ["api"]
    # hardening: unprivileged user, read-only root filesystem (writes go to
    # the library volume and /tmp), no capabilities, no privilege escalation,
    # and resource caps so one bad file can't take the host down
    user: "${KIST_UID:-1000}:${KIST_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${KIST_MEM_LIMIT:-4g}
    pids_limit: 512
    environment:
      KIST_TOKEN: ${KIST_TOKEN:?set KIST_TOKEN in .env}
      KIST_DATABASE_URL: postgresql+psycopg://kist:${KIST_DB_PASSWORD:-kist}@db:5432/kist
      KIST_USER_AGENT: ${KIST_USER_AGENT:-}
      KIST_URL_ALLOW_PRIVATE: ${KIST_URL_ALLOW_PRIVATE:-false}
      KIST_URL_ALLOW_HOSTS: ${KIST_URL_ALLOW_HOSTS:-}
      KIST_DOWNLOAD_TIMEOUT_SECONDS: ${KIST_DOWNLOAD_TIMEOUT_SECONDS:-120}
      KIST_PREVIEW_TIMEOUT_SECONDS: ${KIST_PREVIEW_TIMEOUT_SECONDS:-300}
      KIST_HSTS_SECONDS: ${KIST_HSTS_SECONDS:-15552000}
      KIST_PUBLIC_URL: ${KIST_PUBLIC_URL:-}
    ports:
      - "${KIST_PORT:-8080}:8000"
    volumes:
      - ${KIST_LIBRARY:-./library}:/library
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build: .
    command: ["worker"]
    # hardening: unprivileged user, read-only root filesystem (writes go to
    # the library volume and /tmp), no capabilities, no privilege escalation,
    # and resource caps so one bad file can't take the host down
    user: "${KIST_UID:-1000}:${KIST_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${KIST_MEM_LIMIT:-4g}
    pids_limit: 512
    environment:
      KIST_TOKEN: ${KIST_TOKEN:?set KIST_TOKEN in .env}
      KIST_DATABASE_URL: postgresql+psycopg://kist:${KIST_DB_PASSWORD:-kist}@db:5432/kist
      KIST_USER_AGENT: ${KIST_USER_AGENT:-}
      KIST_URL_ALLOW_PRIVATE: ${KIST_URL_ALLOW_PRIVATE:-false}
      KIST_URL_ALLOW_HOSTS: ${KIST_URL_ALLOW_HOSTS:-}
      KIST_DOWNLOAD_TIMEOUT_SECONDS: ${KIST_DOWNLOAD_TIMEOUT_SECONDS:-120}
      KIST_PREVIEW_TIMEOUT_SECONDS: ${KIST_PREVIEW_TIMEOUT_SECONDS:-300}
      KIST_HSTS_SECONDS: ${KIST_HSTS_SECONDS:-15552000}
      KIST_JOB_LEASE_SECONDS: ${KIST_JOB_LEASE_SECONDS:-900}
    volumes:
      - ${KIST_LIBRARY:-./library}:/library
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "kist.worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
