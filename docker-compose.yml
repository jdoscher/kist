# Logs: every service keeps at most 5 x 10 MB of json-file logs, and they
# survive `docker compose restart` (but not a container re-create). When
# something is wrong, save them before redeploying:
#   docker compose logs -t > pre-deploy.log
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-kist-build: &kist-build
  context: .
  args:
    # the commit the image is built from, shown by /api/version and deep
    # health. Build with: KIST_GIT_COMMIT=$(git rev-parse --short HEAD) docker compose build
    KIST_GIT_COMMIT: ${KIST_GIT_COMMIT:-unknown}

services:
  db:
    # Postgres 16 with the pgvector extension (Kist 2.0's AI search). It is
    # the official postgres:16 image plus pgvector, so it opens a data
    # directory made by postgres:16 as is: switching images needs no dump
    # and restore. Keep the major version (pg16) in step with your data.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kist
      # internal to the compose network (Postgres publishes no port), but
      # set KIST_DB_PASSWORD in .env anyway
      POSTGRES_PASSWORD: ${KIST_DB_PASSWORD:-kist}
      POSTGRES_DB: kist
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kist -d kist"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  app:
    build: *kist-build
    command: ["api"]
    # hardening: unprivileged user, read-only root filesystem (writes go to
    # the library volume and /tmp), no capabilities, no privilege escalation,
    # and resource caps so one bad file can't take the host down
    user: "${KIST_UID:-1000}:${KIST_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${KIST_MEM_LIMIT:-4g}
    pids_limit: 512
    environment:
      KIST_TOKEN: ${KIST_TOKEN:?set KIST_TOKEN in .env}
      KIST_DATABASE_URL: postgresql+psycopg://kist:${KIST_DB_PASSWORD:-kist}@db:5432/kist
      KIST_USER_AGENT: ${KIST_USER_AGENT:-}
      KIST_URL_ALLOW_PRIVATE: ${KIST_URL_ALLOW_PRIVATE:-false}
      KIST_URL_ALLOW_HOSTS: ${KIST_URL_ALLOW_HOSTS:-}
      KIST_DOWNLOAD_TIMEOUT_SECONDS: ${KIST_DOWNLOAD_TIMEOUT_SECONDS:-120}
      KIST_PREVIEW_TIMEOUT_SECONDS: ${KIST_PREVIEW_TIMEOUT_SECONDS:-300}
      KIST_HSTS_SECONDS: ${KIST_HSTS_SECONDS:-15552000}
      KIST_PUBLIC_URL: ${KIST_PUBLIC_URL:-}
      KIST_JOB_LEASE_SECONDS: ${KIST_JOB_LEASE_SECONDS:-900}
      KIST_MAX_UPLOAD_BYTES: ${KIST_MAX_UPLOAD_BYTES:-4294967296}
      KIST_MAX_DOWNLOAD_MB: ${KIST_MAX_DOWNLOAD_MB:-512}
      KIST_LOG_LEVEL: ${KIST_LOG_LEVEL:-INFO}
      KIST_AI_ENABLED: ${KIST_AI_ENABLED:-true}
      KIST_ML_URL: ${KIST_ML_URL:-http://ml:8000}
      KIST_ML_MODEL: ${KIST_ML_MODEL:-ViT-B-32__openai}
      KIST_ML_TIMEOUT_SECONDS: ${KIST_ML_TIMEOUT_SECONDS:-120}
      KIST_AI_WINDOW: ${KIST_AI_WINDOW:-}
    # KIST_BIND is the host address to listen on. 0.0.0.0 (the default) is
    # every interface: anyone on the LAN can reach Kist over plain HTTP.
    # With the reverse proxy on the same host, set KIST_BIND=127.0.0.1.
    ports:
      - "${KIST_BIND:-0.0.0.0}:${KIST_PORT:-8080}:8000"
    volumes:
      - ${KIST_LIBRARY:-./library}:/library
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  worker:
    build: *kist-build
    command: ["worker"]
    # hardening: unprivileged user, read-only root filesystem (writes go to
    # the library volume and /tmp), no capabilities, no privilege escalation,
    # and resource caps so one bad file can't take the host down
    user: "${KIST_UID:-1000}:${KIST_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${KIST_MEM_LIMIT:-4g}
    pids_limit: 512
    environment:
      KIST_TOKEN: ${KIST_TOKEN:?set KIST_TOKEN in .env}
      KIST_DATABASE_URL: postgresql+psycopg://kist:${KIST_DB_PASSWORD:-kist}@db:5432/kist
      KIST_USER_AGENT: ${KIST_USER_AGENT:-}
      KIST_URL_ALLOW_PRIVATE: ${KIST_URL_ALLOW_PRIVATE:-false}
      KIST_URL_ALLOW_HOSTS: ${KIST_URL_ALLOW_HOSTS:-}
      KIST_DOWNLOAD_TIMEOUT_SECONDS: ${KIST_DOWNLOAD_TIMEOUT_SECONDS:-120}
      KIST_PREVIEW_TIMEOUT_SECONDS: ${KIST_PREVIEW_TIMEOUT_SECONDS:-300}
      KIST_JOB_LEASE_SECONDS: ${KIST_JOB_LEASE_SECONDS:-900}
      KIST_VERIFY_INTERVAL_HOURS: ${KIST_VERIFY_INTERVAL_HOURS:-24}
      KIST_MAX_DOWNLOAD_MB: ${KIST_MAX_DOWNLOAD_MB:-512}
      KIST_INBOX_POLL_SECONDS: ${KIST_INBOX_POLL_SECONDS:-5}
      KIST_WORKER_POLL_SECONDS: ${KIST_WORKER_POLL_SECONDS:-2}
      KIST_LOG_LEVEL: ${KIST_LOG_LEVEL:-INFO}
      KIST_AI_ENABLED: ${KIST_AI_ENABLED:-true}
      KIST_ML_URL: ${KIST_ML_URL:-http://ml:8000}
      KIST_ML_MODEL: ${KIST_ML_MODEL:-ViT-B-32__openai}
      KIST_ML_TIMEOUT_SECONDS: ${KIST_ML_TIMEOUT_SECONDS:-120}
      KIST_AI_WINDOW: ${KIST_AI_WINDOW:-}
      KIST_AI_CONCURRENCY: ${KIST_AI_CONCURRENCY:-1}
      KIST_AI_OCR_PDF_PAGES: ${KIST_AI_OCR_PDF_PAGES:-5}
      # KIST_AI_WINDOW is in this time zone
      TZ: ${TZ:-UTC}
    volumes:
      - ${KIST_LIBRARY:-./library}:/library
    depends_on:
      db:
        condition: service_healthy
      # not service_healthy: the first start downloads the models, and the
      # worker retries AI jobs until the ml service answers
      ml:
        condition: service_started
    # the worker writes library/.kist/worker-heartbeat every 15 s after a
    # database round trip, from its own thread, so a long preview or
    # download doesn't make it look dead
    healthcheck:
      test: ["CMD", "python", "-m", "kist.worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    restart: unless-stopped
    logging: *logging

  # CLIP embeddings + OCR (kist/ml). Internal only: no ports, reached by the
  # worker and app as http://ml:8000. Model files (~600 MB for ViT-B-32)
  # download into the ml-models volume on first start.
  ml:
    build:
      context: .
      dockerfile: ml/Dockerfile
      args:
        # 1 = ONNX Runtime with OpenVINO, for an Intel GPU (+~200 MB)
        OPENVINO: ${KIST_ML_OPENVINO:-0}
    image: kist-ml
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # ViT-B-32 + RapidOCR loaded and used: about 1.2 GB resident (see README)
    mem_limit: ${KIST_ML_MEM_LIMIT:-2g}
    cpus: ${KIST_ML_CPUS:-4}
    pids_limit: 256
    environment:
      KIST_ML_MODEL: ${KIST_ML_MODEL:-ViT-B-32__openai}
      # inference threads per request; 4 keeps a 10-core NAS responsive
      KIST_ML_THREADS: ${KIST_ML_THREADS:-4}
      # requests that run inference at once (the rest queue)
      KIST_ML_CONCURRENCY: ${KIST_ML_CONCURRENCY:-1}
      # cpu (default) | openvino-gpu (needs KIST_ML_OPENVINO=1 and /dev/dri below)
      KIST_ML_DEVICE: ${KIST_ML_DEVICE:-cpu}
      # unload a model after this long unused (seconds; 0 = never)
      KIST_ML_IDLE_SECONDS: ${KIST_ML_IDLE_SECONDS:-300}
      KIST_ML_BASE_URL: ${KIST_ML_BASE_URL:-https://huggingface.co}
      KIST_LOG_LEVEL: ${KIST_LOG_LEVEL:-INFO}
    volumes:
      - ml-models:/models
    # Intel GPU (KIST_ML_DEVICE=openvino-gpu): pass the render node through
    # and add the group that owns it on the host
    # (`stat -c %g /dev/dri/renderD128`):
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "${KIST_RENDER_GID:-105}"
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  ml-models:
