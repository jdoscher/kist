[project]
name = "kist"
version = "1.0.0"
description = "Self-hosted visual asset manager with a first-class MCP interface"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-ulid>=2.7",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pyvips>=2.2",
    "pypdfium2>=4.30",
    "pillow>=10.3",
    "pillow-heif>=0.16",
    "imagehash>=4.3",
    "python-magic>=0.4.27",
    "mcp>=2.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/jdoscher/kist"

[project.scripts]
kist = "kist.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kist"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's Depends()/Query() defaults
