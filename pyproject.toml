[project]
name = "kist"
version = "1.5.0"
description = "Self-hosted visual asset manager with a first-class MCP interface"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-ulid>=2.7",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pyvips>=2.2",
    "pypdfium2>=4.30",
    "pillow>=10.3",
    "pillow-heif>=0.16",
    "imagehash>=4.3",
    "numpy>=1.26",  # clustering, duplicate and tag-suggestion maths (M2)
    "python-magic>=0.4.27",
    "mcp>=2.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# the models, for `kist helper` (and the ml image: see ml/requirements.txt)
ml = [
    "onnxruntime>=1.20",
    "numpy>=1.26",
    "tokenizers>=0.20",
    "rapidocr-onnxruntime>=1.4.4,<2",
]

# Milestone 5 media extras (the Docker image installs them; everything works
# without them, with the fallbacks named in docs/architecture.md):
# fontTools reads WOFF2 fonts (built-in reader: TTF/OTF/WOFF), resvg-py
# renders SVG thumbnails (fallback: libvips' librsvg), trimesh converts
# OBJ/STL/PLY to GLB for the web viewer (fallback: no conversion)
media = [
    "fonttools>=4.50",
    "brotli>=1.1",
    "resvg-py>=0.2",
    "trimesh>=4",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/jdoscher/kist"

[project.scripts]
kist = "kist.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kist"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's Depends()/Query() defaults

[tool.ruff.lint.per-file-ignores]
# the brand generator builds long SVG strings (docs/brand.md)
"docs/brand/*.py" = ["E501"]
# the demo scripts drive Playwright/ffmpeg with long argument lists
"docs/demo/*.py" = ["E501"]
